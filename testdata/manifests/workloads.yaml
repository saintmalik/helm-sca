apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: init
          image: busybox:1.36
      containers:
        - name: web
          image: nginx:1.27.0
        - name: sidecar
          image: ghcr.io/example/sidecar@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: job
              image: curlimages/curl:8.5.0
          restartPolicy: OnFailure
---
apiVersion: v1
kind: Pod
metadata:
  name: alone
spec:
  containers:
    - name: c
      image: "alpine:3.20"
  ephemeralContainers:
    - name: debug
      image: nicolaka/netshoot:latest
