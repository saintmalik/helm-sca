name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o helm-sca ./cmd/helm-sca
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Smoke inventory
        run: |
          set -euo pipefail
          ./helm-sca inventory --manifests ./testdata/manifests --format list | grep -q nginx
          ./helm-sca inventory --chart ./testdata/charts/demo -f ./testdata/charts/demo/values.yaml --format list | grep -q 'nginx:1.27.0'
          ./helm-sca inventory --argo-apps ./testdata/apps --repo-root . --format list | grep -q 'nginx:1.27.0'
